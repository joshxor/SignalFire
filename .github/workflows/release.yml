name: Validate and package SignalFire

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signalfire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Validate addon structure
        shell: bash
        run: |
          set -euo pipefail
          test -f SignalFire/SignalFire.toc

          mapfile -t toc_files < <(sed 's/\r$//' SignalFire/SignalFire.toc | grep -v '^##' | grep -v '^[[:space:]]*$')
          test "${#toc_files[@]}" -gt 0

          for file in "${toc_files[@]}"; do
            test -f "SignalFire/$file" || {
              echo "Missing TOC file: SignalFire/$file"
              exit 1
            }
          done

          mapfile -t lua_files < <(find SignalFire -maxdepth 1 -type f -name '*.lua' -printf '%f\n' | sort)
          test "${#lua_files[@]}" -eq "${#toc_files[@]}"

          for file in "${lua_files[@]}"; do
            printf '%s\n' "${toc_files[@]}" | grep -Fxq "$file" || {
              echo "Unlisted Lua file: SignalFire/$file"
              exit 1
            }
          done

      - name: Validate Lua syntax
        run: luac5.1 -p SignalFire/*.lua

      - name: Run Marketplace Phase 1E source verifier
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node tests/verify_marketplace_phase1e_sources.js

      - name: Run Marketplace Phase 1F source verifier
        shell: bash
        run: |
          set -euo pipefail
          node tests/verify_marketplace_phase1f_sources.js

      - name: Run Marketplace Phase 2A network source verifier
        shell: bash
        run: |
          set -euo pipefail
          node tests/verify_marketplace_phase2a_network_sources.js

      - name: Run Marketplace Phase 2B replay source verifier
        shell: bash
        run: node tests/verify_marketplace_phase2b_replay_sources.js

      - name: Run Marketplace Phase 2B exact-links source verifier
        shell: bash
        run: node tests/verify_marketplace_phase2b_exact_links_sources.js

      - name: Run Marketplace Phase 2B Share source verifier
        shell: bash
        run: node tests/verify_marketplace_phase2b_share_sources.js

      - name: Run runtime FPS cleanup source verifier
        shell: bash
        run: node tests/verify_runtime_fps_cleanup_sources.js

      - name: Run listing broadcast UX source verifier
        shell: bash
        run: node tests/verify_listing_broadcast_ux_sources.js

      - name: Run activity discovery Pass A source verifier
        shell: bash
        run: node tests/verify_activity_discovery_pass_a_sources.js

      - name: Run activity discovery Pass B source verifier
        shell: bash
        run: node tests/verify_activity_discovery_pass_b_sources.js

      - name: Run Public Groups World Boss and intent source verifier
        shell: bash
        run: node tests/verify_public_groups_world_boss_intent_sources.js

      - name: Run Public Groups alerts and rules source verifier
        shell: bash
        run: node tests/verify_public_groups_alerts_rules_sources.js

      - name: Prepare Marketplace test loader
        shell: bash
        run: |
          set -euo pipefail
          node tests/extract_addon_loader.js tests/parser_regression_harness.lua /tmp/signalfire-addon-loader.lua
          test -s /tmp/signalfire-addon-loader.lua

      - name: Run Marketplace Create/Edit harness
        shell: bash
        run: |
          set -euo pipefail
          lua5.1 tests/marketplace_create_edit_harness.lua SignalFire /tmp/signalfire-addon-loader.lua

      - name: Run Marketplace regression harnesses
        shell: bash
        run: |
          set -uo pipefail
          status=0
          run_harness() {
            local harness="$1"
            echo "::group::$harness"
            if lua5.1 "$harness" SignalFire /tmp/signalfire-addon-loader.lua; then
              echo "PASS: $harness"
            else
              echo "FAIL: $harness"
              status=1
            fi
            echo "::endgroup::"
          }
          run_harness tests/marketplace_browse_type_profession_filters_harness.lua
          run_harness tests/marketplace_browse_location_availability_filters_harness.lua
          run_harness tests/marketplace_browse_favorites_clear_filters_harness.lua
          run_harness tests/marketplace_my_listings_harness.lua
          run_harness tests/marketplace_favorites_harness.lua
          run_harness tests/marketplace_phase1b_lazy_ui_harness.lua
          run_harness tests/marketplace_local_actions_harness.lua
          run_harness tests/marketplace_network_sync_harness.lua
          run_harness tests/marketplace_network_replay_harness.lua
          run_harness tests/marketplace_exact_link_lookup_harness.lua
          run_harness tests/marketplace_share_link_harness.lua
          run_harness tests/runtime_fps_cleanup_harness.lua
          run_harness tests/listing_broadcast_ux_harness.lua
          run_harness tests/activity_discovery_pass_a_harness.lua
          run_harness tests/activity_discovery_pass_b_harness.lua
          run_harness tests/public_groups_world_boss_intent_harness.lua
          run_harness tests/public_groups_alerts_rules_harness.lua
          exit "$status"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^## Version:[[:space:]]*//p' SignalFire/SignalFire.toc | tr -d '\r')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version v$version"
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/SignalFire-${{ steps.version.outputs.version }}.zip" SignalFire
          cd dist
          sha256sum "SignalFire-${{ steps.version.outputs.version }}.zip" > "SignalFire-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalFire-${{ steps.version.outputs.version }}
          path: |
            dist/SignalFire-${{ steps.version.outputs.version }}.zip
            dist/SignalFire-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SignalFire ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            dist/SignalFire-${{ steps.version.outputs.version }}.zip
            dist/SignalFire-${{ steps.version.outputs.version }}.zip.sha256
